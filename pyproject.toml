[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-generation"
version = "0.1.0"
description = "Synthetic data generation utilities (GANs, diffusion, etc.)"
dependencies = ["torch", "numpy", "tqdm", "torchvision"]

[tool.setuptools.packages.find]
where = ["src"]

